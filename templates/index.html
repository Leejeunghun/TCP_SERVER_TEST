<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCP 통신 테스트 대시보드</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <header>
    <h1>TCP 통신 테스트 대시보드</h1>
    <div class="server-info">
      <span>서버 <strong>{{ host }}:{{ port }}</strong></span>
      <span>Idle 타임아웃 <strong>{{ idle_timeout }}s</strong></span>
      <span id="conn-indicator" class="badge badge-gray">웹소켓 연결중...</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">
        <h2>클라이언트 (<span id="client-count">0</span>)</h2>
        <button id="clear-disconnected">끊긴 항목 지우기</button>
      </div>
      <div class="table-wrap">
        <table id="client-table">
          <thead>
            <tr>
              <th>상태</th>
              <th>클라이언트</th>
              <th>연결 시각</th>
              <th>Idle</th>
              <th>수신 / 송신</th>
              <th>수신 횟수</th>
              <th>테스트 전송</th>
              <th>로그</th>
            </tr>
          </thead>
          <tbody id="client-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>이벤트 로그</h2>
        <button id="clear-events">로그 지우기</button>
      </div>
      <div id="event-log" class="event-log"></div>
    </section>
  </main>

  <script>window.IDLE_TIMEOUT = {{ idle_timeout }};</script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
